# ╔══════════════════════════════════════════════════════════════════╗
# ║  VIDHYA BOT — Nginx Upstream Routing                            ║
# ╚══════════════════════════════════════════════════════════════════╝

# ── Upstream Definitions ───────────────────────────────────────────

upstream backend_upstream {
    server backend:8000;
    keepalive 32;
}

upstream frontend_upstream {
    server frontend:3000;
    keepalive 16;
}

upstream flower_upstream {
    server flower:5555;
}

# ── Main Server Block ─────────────────────────────────────────────

server {
    listen 80;
    server_name vidhya.innovnext.tech;

    # ── Security ───────────────────────────────────────────────────
    # Block common attack paths
    location ~ /\. {
        deny all;
        return 404;
    }

    location ~* \.(env|git|sql|bak|old|tmp)$ {
        deny all;
        return 404;
    }

    # ── Health Check (basic — public, rate limited) ────────────────
    location = /health {
        limit_req zone=api_general burst=5 nodelay;
        proxy_pass http://backend_upstream/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    # ── Health Check (detailed — internal only) ─────────────────────
    location = /health/detailed {
        # Block all external access — only Docker-internal or localhost allowed
        allow 127.0.0.1;
        allow 172.16.0.0/12;   # Docker bridge networks
        allow 10.0.0.0/8;      # Private networks
        deny all;

        proxy_pass http://backend_upstream/health/detailed;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    # ── API: Authentication ────────────────────────────────────────
    location /api/v1/auth/ {
        limit_req zone=api_auth burst=5 nodelay;

        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # ── API: AI Endpoints (SSE streaming) ──────────────────────────
    location /api/v1/ai/ {
        limit_req zone=api_ai burst=3 nodelay;

        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;

        # SSE streaming support — critical!
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Long timeout for streaming responses
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── API: Document Upload ───────────────────────────────────────
    location /api/v1/documents/upload {
        limit_req zone=api_upload burst=2 nodelay;

        client_max_body_size 100m;

        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;

        # Upload timeout
        proxy_read_timeout 120s;
    }

    # ── API: Payment Webhook (public, no auth) ─────────────────────
    location = /api/v1/payments/webhook {
        # No rate limit on webhooks (PhonePe needs reliable delivery)
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # ── API: All Other Routes ──────────────────────────────────────
    location /api/v1/ {
        limit_req zone=api_general burst=10 nodelay;

        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
    }

    # ── Block API Docs (defense-in-depth even if DEBUG=false) ─────
    location ~* ^/(docs|redoc|openapi\.json)$ {
        return 404;
    }


    # ── Frontend (React) ──────────────────────────────────────────
    location / {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;

        # Bypass localtunnel interstitial page (breaks Telegram WebApp initData)
        add_header Bypass-Tunnel-Reminder true always;
        add_header ngrok-skip-browser-warning true always;

        # WebSocket support for Vite HMR (dev only)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
