# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  VIDHYA BOT PLATFORM v3 — Docker Compose (Full Local Stack)            ║
# ║  13 Services: postgres, redis, ollama, minio, backend, worker,         ║
# ║               celery-beat, flower, bot, frontend, nginx + 2 init       ║
# ╚══════════════════════════════════════════════════════════════════════════╝

services:

  # ═══════════════════════════════════════════════════════════════════
  # DATA LAYER
  # ═══════════════════════════════════════════════════════════════════

  postgres:
    image: pgvector/pgvector:pg18
    container_name: vidhya-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vidhya} -d ${POSTGRES_DB:-vidhya_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - vidhya-network

  redis:
    image: redis:8.6.3-alpine
    container_name: vidhya-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - vidhya-network



  # ═══════════════════════════════════════════════════════════════════
  # OBJECT STORAGE
  # ═══════════════════════════════════════════════════════════════════

  minio:
    image: minio/minio
    container_name: vidhya-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000" # API
      - "127.0.0.1:9001:9001" # Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD-SHELL", "mc ready local || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - vidhya-network

  minio-init:
    image: minio/mc
    container_name: vidhya-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c" ]
    environment:
      - MC_HOST_vidhya=http://${MINIO_ROOT_USER:-minioadmin}:${MINIO_ROOT_PASSWORD:-CHANGE_ME}@minio:9000
    command:
      - |
        echo "→ Creating bucket: ${MINIO_BUCKET:-vidhya-documents}"
        mc mb --ignore-existing vidhya/${MINIO_BUCKET:-vidhya-documents}
        echo "→ Setting bucket policy to private..."
        mc anonymous set none vidhya/${MINIO_BUCKET:-vidhya-documents}
        echo "✓ MinIO initialization complete!"
        mc ls vidhya/
    env_file: .env
    networks:
      - vidhya-network

  # ═══════════════════════════════════════════════════════════════════
  # APPLICATION LAYER
  # ═══════════════════════════════════════════════════════════════════

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vidhya-backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/app:/app/app:ro
      - ./.env:/app/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - vidhya-network

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vidhya-worker
    restart: unless-stopped
    env_file: .env
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=${CELERY_WORKER_CONCURRENCY:-2} -Q pdf,analytics,quota,conversations
    healthcheck:
      disable: true
    volumes:
      - ./backend/app:/app/app:ro
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vidhya-network

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vidhya-celery-beat
    restart: unless-stopped
    env_file: .env
    command: celery -A app.workers.celery_app beat --loglevel=info
    healthcheck:
      disable: true
    volumes:
      - ./backend/app:/app/app:ro
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vidhya-network

  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vidhya-flower
    restart: unless-stopped
    env_file: .env
    command: celery -A app.workers.celery_app flower --port=5555 --broker=${CELERY_BROKER_URL}
    healthcheck:
      disable: true
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - vidhya-network

  # ═══════════════════════════════════════════════════════════════════
  # TELEGRAM BOT
  # ═══════════════════════════════════════════════════════════════════

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: vidhya-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./bot:/app:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - vidhya-network

  # ═══════════════════════════════════════════════════════════════════
  # FRONTEND
  # ═══════════════════════════════════════════════════════════════════

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vidhya-frontend
    restart: unless-stopped
    volumes:
      - ./frontend/src:/app/src:ro
    networks:
      - vidhya-network

  # ═══════════════════════════════════════════════════════════════════
  # REVERSE PROXY
  # ═══════════════════════════════════════════════════════════════════

  nginx:
    image: nginx:alpine
    container_name: vidhya-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - vidhya-network

# ═══════════════════════════════════════════════════════════════════
# VOLUMES & NETWORKS
# ═══════════════════════════════════════════════════════════════════

volumes:
  postgres_data:
    name: vidhya-postgres-data
  redis_data:
    name: vidhya-redis-data

  minio_data:
    name: vidhya-minio-data

networks:
  vidhya-network:
    name: vidhya-network
    driver: bridge
