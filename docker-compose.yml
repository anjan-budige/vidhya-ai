
services:


  postgres:
    build:
      context: ./infrastructure/postgres
      dockerfile: Dockerfile
    image: vidhya-ai-postgres:18-pgvector0.8.7
    container_name: vidhya-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vidhya} -d ${POSTGRES_DB:-vidhya_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - vidhya-network

  redis:
    image: redis:8.6.7-alpine
    container_name: vidhya-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - vidhya-network




  # Silo — S3-compatible MinIO fork (MinIO images are no longer public)
  minio:
    image: pgsty/silo:RELEASE.2026-10-18T00-00-00Z-distroless
    container_name: vidhya-silo
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000" # S3 API
      - "127.0.0.1:9001:9001" # Console
    volumes:
      - minio_data:/data
    networks:
      - vidhya-network

  minio-init:
    image: pgsty/silo:RELEASE.2026-10-18T00-00-00Z
    container_name: vidhya-silo-init
    restart: "no"
    depends_on:
      minio:
        condition: service_started
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        echo "→ Waiting for Silo..."
        mcli alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" || true
        for i in $$(seq 1 30); do
          mcli ls local >/dev/null 2>&1 && break
          sleep 2
        done
        echo "→ Creating bucket: $$MINIO_BUCKET"
        mcli mb --ignore-existing local/$$MINIO_BUCKET
        echo "→ Setting bucket policy to private..."
        mcli anonymous set none local/$$MINIO_BUCKET
        echo "✓ Silo initialization complete!"
        mcli ls local/
    env_file: .env
    networks:
      - vidhya-network


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vidhya-backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/app:/app/app:ro
      - ./.env:/app/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - vidhya-network

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vidhya-worker
    restart: unless-stopped
    env_file: .env
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=${CELERY_WORKER_CONCURRENCY:-2} -Q pdf,analytics,quota,conversations
    healthcheck:
      disable: true
    volumes:
      - ./backend/app:/app/app:ro
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vidhya-network

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vidhya-celery-beat
    restart: unless-stopped
    env_file: .env
    command: celery -A app.workers.celery_app beat --loglevel=info
    healthcheck:
      disable: true
    volumes:
      - ./backend/app:/app/app:ro
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vidhya-network

  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vidhya-flower
    restart: unless-stopped
    env_file: .env
    command: celery -A app.workers.celery_app flower --port=5555 --broker=${CELERY_BROKER_URL}
    healthcheck:
      disable: true
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - vidhya-network


  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: vidhya-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./bot:/app:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - vidhya-network


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vidhya-frontend
    restart: unless-stopped
    volumes:
      - ./frontend/src:/app/src:ro
    networks:
      - vidhya-network


  nginx:
    image: nginx:1.31.8-alpine3.24-slim
    container_name: vidhya-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - vidhya-network


volumes:
  postgres_data:
    name: vidhya-postgres-data
  redis_data:
    name: vidhya-redis-data

  minio_data:
    name: vidhya-minio-data

networks:
  vidhya-network:
    name: vidhya-network
    driver: bridge
